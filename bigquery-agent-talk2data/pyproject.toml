[project]
name = "ca-bridge-agent"
version = "0.1.0"
description = "Conversational Analytics Bridge Agent on Vertex AI Reasoning Engine."
authors = [
    {name = "Julien Miquel", email = "julienmiquel@google.com"},
]
dependencies = [
    "google-adk>=1.15.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai==0.7b0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.132.0,<2.0.0",
    "google-cloud-geminidataanalytics",
    "google-genai",
    "protobuf>=6.31.1,<7.0.0",
    "absl-py>=2.2.1",
    "requests",
    "python-dotenv",
    "pydantic>=2.0.0",
    "a2ui-agent-sdk",
    "Pillow>=10.0.0",
]
requires-python = ">=3.10,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
